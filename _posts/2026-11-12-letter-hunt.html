<title>Letter Hunt</title>
<!--
Prior art (searched 2026-11-12). None combines many-font letter hunt + drag-merge blobs.
- TinyTap uppercase letters course: tap letters, varied fonts/colours. Closest to Find mode. https://campus.tinytap.com/course/1185
- Twinkl "Letter Detectives": find-and-cover letters in different fonts. Paper worksheets. https://www.twinkl.com/resource/letter-detectives-identify-letters-in-different-fonts-find-and-cover-worksheets-prek-k-us-e-1755026441
- I like ABC: falling letters, merge matching ones, a few fonts. Closest to Blob mode. https://apps.apple.com/ky/app/i-like-abc/id6478535542
- Alphabets Recognition Activity: drag-match upper/lower, several fonts. https://apps.apple.com/app/apple-store/id1100602106
- Find the Letter: tap the odd letter out. https://apps.apple.com/ag/app/find-the-letter/id1033168199
- Keiki Letter Seek & Find: tap uppercase letters hidden in scenes. https://keiki.app/learning-games-for-kids/hidden-letters
- Alphabetic: tap letters in order; reviewer wanted more fonts (gap). https://www.gamezebo.com/reviews/alphabetic-review/
-->

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff8ec; font-family: system-ui, sans-serif; }
  #bar { position: fixed; top: 0; left: 0; right: 0; min-height: 64px; display: flex; flex-wrap: wrap; row-gap: 6px; align-items: center; gap: 8px;
         padding: 6px 10px; background: #fff; box-shadow: 0 2px 8px #0001; z-index: 20; }
  .seg { display: flex; border-radius: 10px; overflow: hidden; border: 2px solid #ddd; flex-shrink: 0; }
  .seg button, .btn { font: 600 18px system-ui; padding: 8px 12px; border: 0; background: #fff; color: #555; cursor: pointer; }
  .seg button.on { background: #ffb703; color: #222; }
  .btn { border-radius: 10px; border: 2px solid #ddd; font-size: 22px; padding: 4px 10px; }
  #prompt { flex: 1; text-align: center; font: 700 32px system-ui; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #prompt b { font-family: 'Andika', sans-serif; }  /* literacy font: l vs I distinct */
  #prompt small { font-size: 16px; font-weight: 500; color: #888; }
  #stars { font-size: 20px; min-width: 50px; text-align: right; }
  #board { position: fixed; top: 64px; left: 0; right: 0; bottom: 0; touch-action: none; }
  .tile { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
          background: #fff; box-shadow: 0 3px 10px #0002; user-select: none; -webkit-user-select: none; cursor: pointer;
          transition: left .25s, top .25s, width .25s, height .25s, font-size .25s, opacity .3s; touch-action: none; }
  .tile span { line-height: 1; pointer-events: none; white-space: nowrap; }
  .tile.dragging { transition: none; z-index: 10; box-shadow: 0 8px 24px #0003; }
  .tile.found { opacity: .45; box-shadow: inset 0 0 0 5px #2a9d8f; }
  .tile.pop { animation: pop .35s; }
  .tile.wiggle { animation: wiggle .35s; }
  .tile.bubble { animation: bubble .45s; }
  .win .tile { animation: bounce .6s infinite alternate; }
  @keyframes pop { 50% { transform: scale(1.35); } }
  @keyframes wiggle { 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
  @keyframes bubble { 30% { transform: scale(1.3, .8); } 60% { transform: scale(.9, 1.15); } }
  @keyframes bounce { to { transform: translateY(-16px); } }
  .tile.spawn { animation: spawnIn .4s; }
  .tile.burst { animation: burstOut .45s forwards; pointer-events: none; }
  @keyframes spawnIn { from { transform: scale(0); } }
  .tile.ready { z-index: 5; box-shadow: 0 0 0 6px #ffb703, 0 0 28px #ffb703aa; }
  @keyframes burstOut { to { transform: scale(1.7); opacity: 0; } }
  .spark { position: absolute; width: 16px; height: 16px; margin: -8px; border-radius: 50%; pointer-events: none;
           transition: transform .6s ease-out, opacity .6s; }
  #settings { position: fixed; right: 10px; z-index: 25; background: #fff; border-radius: 14px; padding: 12px 16px;
              box-shadow: 0 6px 24px #0003; font: 15px system-ui; width: min(320px, calc(100vw - 20px)); }
  #settings label { display: grid; grid-template-columns: 1fr 44px; gap: 2px 8px; align-items: center; margin: 8px 0; }
  #settings input[type=range] { grid-column: 1 / -1; width: 100%; }
  #settings output { text-align: right; color: #888; }
  #recorder { position: fixed; left: 10px; right: 10px; top: 70px; max-height: calc(100vh - 90px); overflow: auto; z-index: 26;
              background: #fff; border-radius: 14px; padding: 12px 16px; box-shadow: 0 6px 24px #0003; font: 15px system-ui; }
  #recorder .rhead { display: flex; gap: 10px; align-items: center; } #recorder .rhead span { flex: 1; color: #666; }
  #recorder .warn { color: #d62828; }
  #recorder .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 10px; }
  #recorder .rcell { display: flex; align-items: center; gap: 4px; border: 2px solid #eee; border-radius: 10px; padding: 4px 8px; }
  #recorder .rcell span { flex: 1; font: 26px 'Andika', sans-serif; }
  #recorder .rcell button { border: 0; background: #f3f3f3; border-radius: 8px; font-size: 16px; padding: 4px 7px; cursor: pointer; }
  #recorder .rcell button.on { background: #e63946; color: #fff; }
  #recorder .rcell.has { border-color: #2a9d8f; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff8ecee; z-index: 30; }
  #overlay button { font: 700 40px system-ui; padding: 24px 48px; border-radius: 24px; border: 0; background: #ffb703; cursor: pointer; }
  @media (max-width: 600px) { #prompt { font-size: 22px; order: 9; flex-basis: 100%; } .seg button { padding: 6px 8px; font-size: 15px; } }
</style>

<body>
<div id="bar">
  <div class="seg" id="contentSeg" title="Letters, letter teams, words"><button data-v="letters">a</button><button data-v="teams">sh</button><button data-v="words">cat</button></div>
  <div class="seg" id="modeSeg"><button data-v="find">Find</button><button data-v="blob">Blob</button></div>
  <div class="seg" id="caseSeg"><button data-v="lower">abc</button><button data-v="upper">ABC</button><button data-v="mixed">aBc</button></div>
  <div class="seg" id="saySeg" title="Say the sound, the letter name, or an example word"><button data-v="sound">ah</button><button data-v="name">A</button><button data-v="word">🍎</button></div>
  <div id="prompt"></div>
  <button class="btn" id="sayBtn" title="Say again">🔊</button>
  <button class="btn" id="newBtn" title="New round">↻</button>
  <button class="btn" id="fsBtn" title="Toggle Fullscreen (F)">⛶</button>
  <span id="stars"></span>
  <button class="btn" id="setBtn" title="Settings">⚙</button>
</div>
<div id="board"></div>
<div id="overlay"><button id="startBtn">Loading…</button></div>
<script>
// ---------- CONFIG: edit here ----------
const CONFIG = {
  // Read Write Inc. order (Plumcroft uses RWI). Set 1 sounds then Set 2 "special friends". From memory of the
  // RWI Speed Sounds charts: check against the sheets school sends home and fix here. No q alone (RWI teaches qu).
  order: ('m a s d t i n p g o c k u b f e l h sh r j v y w th z ch qu x ng nk ' +
          'ay ee igh ow oo ar or air ir ou oy').split(' '),
  taught: 42,          // how far through `order` the child has got; ⚙ "Sounds taught". Newest few get extra practice.
  newCount: 3,         // the last N taught sounds count as "new" (picked about twice as often)
  // Letter teams: [TTS sound spelling, example word]. ck isn't in the order but is needed to sound out duck/back.
  // Set 2 ow = "blow", ou = "cloud" (RWI). Set 3 (ai, oa, ew, a-e ...) not added yet.
  teams: { sh: ['shh', 'ship'], th: ['thh', 'thumb'], ch: ['chuh', 'chip'], qu: ['kwuh', 'queen'], ng: ['ing', 'ring'],
    nk: ['ink', 'pink'], ck: ['kuh', 'duck'], ay: ['ay', 'play'], ee: ['ee', 'bee'], igh: ['eye', 'night'], ow: ['oh', 'snow'],
    oo: ['oo', 'moon'], ar: ['ar', 'car'], or: ['or', 'fork'], air: ['air', 'chair'], ir: ['er', 'bird'], ou: ['ow', 'cloud'],
    oy: ['oy', 'toy'] },
  teamConfusables: { sh: ['ch', 'th'], ch: ['sh', 'th'], th: ['sh', 'ch'], ng: ['nk'], nk: ['ng'], qu: ['ou'],
    ay: ['oy', 'ar'], ee: ['oo'], igh: ['ng'], ow: ['ou', 'oo', 'or'], oo: ['ee', 'ow'], ar: ['or', 'air'],
    or: ['ar', 'ow'], air: ['ar', 'ir'], ir: ['air', 'ar'], ou: ['ow', 'oo'], oy: ['ay', 'ow'] },
  // Words by level. Rhyme families on purpose: lookalikes (same length, 1 letter different) become distractors.
  // Levels 1-3 only use words whose sounds are all taught (falls back to the full list if too few).
  // Level 5 = tricky words (RWI "red words"): can't be sounded out, so never Fred Talked.
  words: { level: 1, tricky: 5, lists: [
    'cat hat bat mat sat pig big dig wig sun bun run fun dog log fog hog pen hen ten den cup pup bed red fox box',
    'stop step frog flag clap clip drum drip swim slim crab grab milk silk jump lamp tent nest best sand hand band plum spin',
    'ship shop chip chop fish dish chin thin moth bath ring sing song king duck back sock pink sink think moon soon feet see car star fork play day night light snow boy toy chair hair bird girl shout out',
    'rabbit garden sunset pocket kitten dragon window rocket monkey picnic tiger spider pirate chicken farmer jumping',
    'the to no go into he she we me be was my you they all are said',
  ].map(l => l.split(' ')) },
  recordMs: 1800,      // max length of one recorded sound
  googleFonts: ['Andika', 'Atkinson Hyperlegible', 'Comic Neue', 'Patrick Hand', 'Lora', 'Merriweather', 'Roboto Slab',
    'Playfair Display', 'Courier Prime', 'Fredoka', 'Josefin Sans', 'Abril Fatface', 'Caveat', 'Oswald', 'Nunito',
    'Bree Serif', 'Kalam', 'Righteous', 'Special Elite', 'Bitter'],
  // Gothic/blackletter, western, pixel, horror, outline... `Name:axes` when a family lacks weight 400.
  wildFonts: ['UnifrakturMaguntia', 'UnifrakturCook:wght@700', 'Pirata One', 'Grenze Gotisch', 'New Rocker', 'Germania One',
    'Metal Mania', 'Cinzel Decorative', 'Monoton', 'Bungee Shade', 'Bungee Inline', 'Rye', 'Creepster', 'Lobster', 'Pacifico',
    'Press Start 2P', 'VT323', 'Silkscreen', 'Bangers', 'Ewert', 'Henny Penny', 'Faster One', 'Fascinate', 'Sancreek', 'Nosifer',
    'Eater', 'Fredericka the Great', 'Rubik Glitch', 'Codystar', 'Shojumaru', 'Ribeye Marrow', 'Zilla Slab Highlight'],
  wildRate: 0.35,      // chance a tile uses a wild font; 0 = tame only
  // No real lowercase (draws G for g): capitals only. Found via fontTools outline diff + a rendered specimen sheet.
  // Dropped entirely: Rubik Puddles (illegible at tile size).
  capsOnlyFonts: ['Bangers', 'Bungee Inline', 'Bungee Shade', 'Codystar', 'Ewert', 'Nosifer', 'Silkscreen', 'Cinzel Decorative',
    'Metal Mania', 'Monoton', 'Creepster', 'Eater', 'Shojumaru'],
  systemFonts: ['serif', 'sans-serif', 'monospace'],
  // rotate: ask for one letter at a time, target changes every tap (forces a fresh sound→letter recall each time).
  // rotate false: classic "find all the g's" (one recall, then visual scanning). targets only used then.
  letters: 24,         // tiles on screen (density). Both modes. Also in ⚙ settings.
  kinds: 5,            // different letters on screen at once (variety). Both modes except classic find.
  find: { rotate: true, prompts: 8, targets: [4, 7], confusableRate: 0.35 },
  showTarget: false,   // false = spoken requests only, letter not shown in the bar (listen, don't match by eye)
  anLetters: 'aefhilmnorsx',  // letter names starting with a vowel sound: "an M", "a G"
  // continuous: a letter fully merged bursts and a fresh group spawns; false = round ends when all merged.
  // speakDelay: ms before naming a picked-up letter, so the child can say it first (time-delay prompting).
  // popOnRequest: finished blobs wait; once popWhen are waiting, voice asks "Pop the m!" and only that one bursts.
  blob: { continuous: true, sizeJitter: 0.4,
          pitchPower: 0.7,  // voice pitch ∝ (base/size)^pitchPower: bigger blob, lower voice
          speakDelay: 1500, popOnRequest: true, popWhen: 2 },
  fill: 0.38,          // fraction of board area covered by tiles
  sizeJitter: 0.2,     // ± fraction of base radius
  rotJitter: 10,       // ± degrees
  // Random per tile, never per letter: colour must not be a cue for identity.
  colors: ['#e63946', '#1d3557', '#2a9d8f', '#f4a261', '#6a4c93', '#e76f51', '#118ab2', '#06a77d', '#d62828', '#3a0ca3'],
  speech: { lang: 'en-GB', rate: 0.8, pitch: 1.1, sayOnTap: true, sayWrong: true },
  names: {},           // spoken overrides, e.g. { a: 'ay', ch: 'C H' }
  // [sound, word]. Sounds are TTS spellings, approximate: TTS can't say pure sounds (school wants "mmm", not "muh").
  // Stretchy sounds spelled long (mmm, sss); stop sounds (b d g p t k) unavoidably get an "uh". Recordings override all this.
  phonics: { a: ['ah', 'apple'], b: ['buh', 'ball'], c: ['kuh', 'cat'], d: ['duh', 'dog'], e: ['eh', 'egg'],
    f: ['fff', 'fish'], g: ['guh', 'goat'], h: ['huh', 'hat'], i: ['ih', 'insect'], j: ['juh', 'jam'], k: ['kuh', 'kite'],
    l: ['lll', 'lion'], m: ['mmm', 'moon'], n: ['nnn', 'nest'], o: ['aw', 'octopus'], p: ['puh', 'pig'], q: ['kwuh', 'queen'],
    r: ['rrr', 'rabbit'], s: ['sss', 'sun'], t: ['tuh', 'tiger'], u: ['uh', 'umbrella'], v: ['vvv', 'van'], w: ['wuh', 'web'],
    x: ['ks', 'fox'], y: ['yuh', 'yo-yo'], z: ['zzz', 'zebra'] },
  confusables: { b: 'dpqh', d: 'bpqa', p: 'bdqg', q: 'bdpg', m: 'nw', n: 'mhu', u: 'nv', w: 'mv', g: 'qpj', a: 'oed',
    e: 'ca', i: 'lj', l: 'it', j: 'ig', t: 'fl', f: 't', h: 'nb', c: 'eo', o: 'ca', v: 'uwy', y: 'vg', s: 'z', z: 's' },
};

// ---------- SETTINGS: ⚙ panel rows. [CONFIG path, label, min, max, step] or [path, label, 'bool']. Saved per browser. ----------
const SETTINGS = [
  ['taught', 'Sounds taught (RWI order)', 2, 42, 1],
  ['letters', 'Tiles on screen', 6, 60, 1],
  ['kinds', 'Different kinds', 2, 12, 1],
  ['wildRate', 'Wild fonts', 0, 1, 0.05],
  ['speech.rate', 'Voice speed', 0.4, 1.4, 0.05],
  ['words.level', 'Words: level (5 = tricky)', 1, 5, 1],
  ['find.prompts', 'Find: taps per round', 3, 20, 1],
  ['blob.speakDelay', 'Blob: naming delay (ms)', 0, 3000, 250],
  ['find.rotate', 'Find: one letter at a time', 'bool'],
  ['blob.popOnRequest', 'Blob: pop on request', 'bool'],
  ['showTarget', 'Show the letter in the bar', 'bool'],
];

// ---------- utils ----------
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = ([a, b]) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get: (k, d) => { try { return localStorage.getItem('lh.' + k) ?? d; } catch { return d; } },
                set: (k, v) => { try { localStorage.setItem('lh.' + k, v); } catch {} },
                del: k => { try { localStorage.removeItem('lh.' + k); } catch {} } };
const fontName = spec => spec.split(':')[0];
const cfgPath = path => { const ks = path.split('.'), last = ks.pop(); return [ks.reduce((o, k) => o[k], CONFIG), last]; };
const cfgGet = path => { const [o, k] = cfgPath(path); return o[k]; };
const cfgSet = (path, v) => { const [o, k] = cfgPath(path); o[k] = v; };
const DEFAULTS = Object.fromEntries(SETTINGS.map(([p]) => [p, cfgGet(p)]));  // only changed values are saved, so CONFIG edits still apply
try { Object.entries(JSON.parse(store.get('settings', '{}'))).forEach(([p, v]) => cfgSet(p, v)); } catch {}
const FONTS = [...CONFIG.googleFonts.map(f => `"${f}"`), ...CONFIG.systemFonts];
const WILD = CONFIG.wildFonts.map(fontName);
const WILD_LOWER = WILD.filter(f => !CONFIG.capsOnlyFonts.includes(f));
const pickFont = text => {
  const wild = text === text.toUpperCase() ? WILD : WILD_LOWER;
  return wild.length && Math.random() < CONFIG.wildRate ? `"${pick(wild)}"` : pick(FONTS);
};

// ---------- audio ----------
let actx;
function tone(f0, f1, dur, type = 'sine', vol = 0.2, delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  ding: () => { tone(880, 1320, 0.15); tone(1320, 1760, 0.2, 'sine', 0.15, 0.1); },
  buzz: () => tone(160, 120, 0.2, 'square', 0.06),
  blurb: n => { const f = Math.max(150, 500 - n * 30); tone(f, f * 2, 0.12, 'sine', 0.25); tone(f * 2, f * 0.8, 0.18, 'sine', 0.2, 0.1); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.25, 'triangle', 0.18, i * 0.12)),
  burst: () => { tone(500, 1600, 0.08, 'sine', 0.25); [1047, 1319, 1568, 2093, 2637].forEach((f, i) => tone(f, f * 1.01, 0.3, 'triangle', 0.1, 0.06 + i * 0.05)); },
};
// ---------- content: letters | teams | words ----------
const taughtList = () => CONFIG.order.slice(0, Math.max(2, CONFIG.taught));
const TEAM_KEYS = Object.keys(CONFIG.teams).sort((a, b) => b.length - a.length);
// Split a word into sounds, longest letter team first: night → n igh t, chair → ch air.
function segment(w) {
  const out = [];
  for (let i = 0; i < w.length;) { const t = TEAM_KEYS.find(t => w.startsWith(t, i)) ?? w[i]; out.push(t); i += t.length; }
  return out;
}
const isTricky = () => CONFIG.words.level === CONFIG.words.tricky;
function tokens() {
  if (S.content === 'words') {
    const list = CONFIG.words.lists[CONFIG.words.level - 1], T = new Set(taughtList());
    const ok = isTricky() ? list : list.filter(w => segment(w).every(g => T.has(g)));
    return ok.length >= 4 ? ok : list;
  }
  const multi = S.content === 'teams', T = taughtList().filter(k => (k.length > 1) === multi);
  return T.length >= 2 ? T : CONFIG.order.filter(k => (k.length > 1) === multi).slice(0, 6);
}
const noun = () => ({ letters: 'letter', teams: 'sound', words: 'word' })[S.content];
function confusablesOf(k) {
  if (S.content === 'teams') return CONFIG.teamConfusables[k] ?? [];
  if (S.content === 'words') return tokens().filter(w => w !== k && w.length === k.length && [...w].filter((c, i) => c !== k[i]).length === 1);
  return [...(CONFIG.confusables[k] ?? '')];
}

// ---------- progress: per-item stats → selection weights (spaced practice, roughly) ----------
// Known items keep coming back, less often; missed and newly taught ones come up more.
let STATS = {}; try { STATS = JSON.parse(store.get('stats', '{}')); } catch {}
function mark(k, ok) {
  const s = STATS[k] ??= { ok: 0, bad: 0, streak: 0 };
  if (ok) { s.ok++; s.streak++; s.bad = Math.max(0, s.bad - 0.5); } else { s.bad++; s.streak = 0; }
  store.set('stats', JSON.stringify(STATS));
}
function weight(k) {
  const s = STATS[k], fresh = S.content !== 'words' && taughtList().slice(-CONFIG.newCount).includes(k) ? 2 : 1;
  return fresh * (s ? Math.max(0.3, 1 + s.bad * 0.6 - Math.min(s.streak, 6) * 0.15) : 1.5);
}
function pickW(arr) {
  const ws = arr.map(weight); let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < arr.length; i++) if ((r -= ws[i]) <= 0) return arr[i];
  return arr.at(-1);
}
const sampleW = (arr, n) => { const pool = [...arr], out = []; while (out.length < n && pool.length) { const k = pickW(pool); out.push(k); pool.splice(pool.indexOf(k), 1); } return out; };

// ---------- voice: parent recordings first, TTS fallback ----------
const REC = {};
for (const k of new Set([...CONFIG.order, ...TEAM_KEYS, ...'abcdefghijklmnopqrstuvwxyz'])) { const v = store.get('rec.' + k); if (v) REC[k] = v; }
const soundOf = g => CONFIG.teams[g]?.[0] ?? CONFIG.phonics[g]?.[0] ?? g;
const soundPart = (g, pitch) => REC[g] ? { rec: g, pitch } : { text: soundOf(g), pitch };
// Fred Talk (RWI's sounding out): "c - a - t", the child blends it into "cat".
const fredParts = (w, pitch) => segment(w).flatMap((g, i) => i ? [{ pause: 250 }, soundPart(g, pitch)] : [soundPart(g, pitch)]);
const article = k => CONFIG.anLetters.includes(k) ? 'an' : 'a';
// What to say for an item on tap / merge / pop. ctx 'pick' = blob pick-up (words: sound out, then the word).
function itemParts(k, pitch, ctx) {
  if (S.content === 'words') {
    const fred = S.sayStyle === 'sound' && !isTricky() && ctx === 'pick';
    return fred ? [...fredParts(k, pitch), { pause: 300 }, { text: k, pitch }] : [{ text: k, pitch }];
  }
  const name = { text: CONFIG.names[k] ?? k.toUpperCase(), pitch }, word = (S.content === 'teams' ? CONFIG.teams : CONFIG.phonics)[k]?.[1];
  if (S.sayStyle === 'word' && word) return S.content === 'letters' ? [{ text: `${k.toUpperCase()} is for ${word}`, pitch }] : [soundPart(k, pitch), { text: `is for ${word}`, pitch }];
  if (S.sayStyle === 'name' && S.content === 'letters') return [name];
  return [soundPart(k, pitch)];
}
// "Find a G" (name) / "Find" + sound / "Find" + Fred Talk (words). classic = "find all the".
function requestParts(verb, k, classic) {
  if (S.content === 'words') return S.sayStyle === 'sound' && !isTricky() ? [{ text: verb }, ...fredParts(k)] : [{ text: `${verb} ${k}` }];
  if (S.sayStyle === 'name' && S.content === 'letters') return [{ text: classic ? `${verb} all the ${k.toUpperCase()}'s` : `${verb} ${article(k)} ${k.toUpperCase()}` }];
  return [{ text: classic ? `${verb} all the` : verb }, soundPart(k)];
}
// Sequencer: parts play in order; a non-queued call cuts in. Chrome quirks: speak() right after cancel() can be
// dropped (hence the 120ms gap); utterances can be GC'd mid-speech (lastUtterance); engine can wedge paused (resume()).
let vq = Promise.resolve(), vgen = 0, curAudio, lastUtterance;
function voice(parts, queue = false) {

// ---------- state ----------
const S = { content: store.get('content', 'letters'), mode: store.get('mode', 'find'), kase: store.get('case', 'lower'), sayStyle: store.get('say', 'sound'), tiles: [], r0: 40, target: null, stars: 0, done: false };
const board = $('#board');

function caseOf(k) {

  return k.length > 1 ? k[0].toUpperCase() + k.slice(1) : k.toUpperCase();  // mixed: "Ship", "Sh", "G"
}
function makeTile(key, jitter = CONFIG.sizeJitter) {
  const text = caseOf(key);

}
const radius = t => Math.min(S.r0 * t.scale * Math.sqrt(t.count), Math.min(board.clientWidth, board.clientHeight) / 3, board.clientWidth / (2.2 * t.aspect));
const hw = t => t.r * t.aspect;  // half-width; half-height is t.r
// Edge-to-edge gap between two pill tiles, treated as rectangles (negative = overlap).
const gapOf = (ax, ay, aw, ah, b) => Math.max(Math.abs(ax - b.x) - aw - hw(b), Math.abs(ay - b.y) - ah - b.r);

function layout(tiles) {

function place(t, others) {

  for (let k = 0; k < 40; k++) {

// Push tiles overlapping t straight away from it (one pass; good enough as blobs grow one at a time).

function burst(t) {

    board.appendChild(p);

      Object.assign(p.style, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) scale(.3)`, opacity: 0 })));

// ---------- modes ----------
const shown = k => S.kase === 'lower' ? k : S.kase === 'upper' ? k.toUpperCase() : k.toUpperCase() + ' ' + k;
const MODES = {
  find: {
    draggable: false,
    canSpeak: () => true,
    setup() {
      const c = CONFIG.find, T = tokens();
      S.asked = 0;

        const n = Math.min(CONFIG.kinds, T.length), kinds = [pickW(T)];
        while (kinds.length < n) {
          const cf = confusablesOf(pick(kinds)).filter(k => T.includes(k)), k = cf.length && Math.random() < c.confusableRate ? pick(cf) : pickW(T);
          if (!kinds.includes(k)) kinds.push(k);

    next() {  // rotate: new target among letters still unfound, different from the last if possible

    },
    prompt() {

    },
    speak(queue = false) { voice(requestParts('Find', S.target, !CONFIG.find.rotate), queue); },
    onTap(t) {

const mode = () => MODES[S.mode];

// ---------- round flow ----------
function newRound() {

// ---------- input ----------
let drag = null;

  const t = e.target.closest('.tile')?.tile;

  if (mode().tapFirst?.(t)) return;

bindSeg('modeSeg', 'mode', 'mode');
bindSeg('caseSeg', 'kase', 'case');
bindSeg('saySeg', 'sayStyle', 'say', () => voice(itemParts(tokens()[0])));

  const save = () => store.set('settings', JSON.stringify(Object.fromEntries(SETTINGS.map(([p]) => [p, cfgGet(p)]).filter(([p, v]) => v !== DEFAULTS[p]))));

// ---------- recorder: parent records each sound once; used instead of TTS wherever present ----------
function openRecorder() {
  let el = $('#recorder');
  if (!el) { el = document.createElement('div'); el.id = 'recorder'; document.body.appendChild(el); }
  const keys = [...new Set([...CONFIG.order, 'ck'])];
  const ok = window.isSecureContext && navigator.mediaDevices && window.MediaRecorder;
  const draw = () => {
    el.innerHTML = `<div class=rhead><b>Record sounds</b><span>Pure sounds, the way school says them: "mmm" not "muh". Tap ●, say it, wait.</span><button class=btn data-close>✕</button></div>`
      + (ok ? '' : '<p class=warn>Recording needs https (the published site) or localhost. Playback of saved sounds still works.</p>')
      + `<div class=rgrid>${keys.map(k => `<div class="rcell${REC[k] ? ' has' : ''}"><span>${k}</span><button data-rec="${k}">●</button>`
      + (REC[k] ? `<button data-play="${k}">▶</button><button data-del="${k}">✕</button>` : '') + '</div>').join('')}</div>`;
  };
  el.onclick = e => {

    else if (d.del) { delete REC[d.del]; store.del('rec.' + d.del); draw(); }

async function record(k, btn) {

  mr.ondataavailable = e => chunks.push(e.data);

    stream.getTracks().forEach(t => t.stop());
    const fr = new FileReader();
    fr.onload = () => { REC[k] = fr.result; store.set('rec.' + k, fr.result); res(); };
    fr.readAsDataURL(new Blob(chunks, { type: mr.mimeType }));
  });
  mr.start(); btn.textContent = '■'; btn.classList.add('on');
  const stop = e => { e?.stopPropagation(); if (mr.state === 'recording') mr.stop(); };
  btn.onclick = stop; setTimeout(stop, CONFIG.recordMs);
  return saved;
}
